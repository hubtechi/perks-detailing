
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You | PERKS Car Wash & Detailing</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #090909;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.thankyou {
    text-align: center;
    max-width: 600px;
    padding: 50px 30px;
    background: #151515;
    border: 1px solid #b99542;
    border-radius: 14px;
}

.logo {
    width: 150px;
    margin-bottom: 30px;
}

.check {
    width: 75px;
    height: 75px;
    border: 2px solid #d4af55;
    color: #d4af55;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin: 0 auto 25px;
}

h1 {
    color: #d4af55;
    font-size: 32px;
    margin-bottom: 18px;
}

p {
    color: #ccc;
    line-height: 1.8;
    margin-bottom: 15px;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    background: #c5a04b;
    color: #080808;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    transition: .3s;
}

.btn:hover {
    background: #e0bd69;
    transform: translateY(-2px);
}

.small {
    font-size: 13px;
    color: #888;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="thankyou">

    <img src="perks-logo.png"
         alt="PERKS Logo"
         class="logo">

    <div class="check">✓</div>

    <h1>Thank You!</h1>

    <p>
        Your quotation request has been
        successfully submitted.
    </p>

    <p>
        Thank you for choosing PERKS Car Wash
        & Detailing L.L.C.
    </p>

    <p>
        Our team will review your selected
        services and contact you shortly.
    </p>

    <a href="index.html" class="btn">
        Return to Homepage
    </a>

    <p class="small">
        © 2026 PERKS Car Wash & Detailing L.L.C.
        All rights reserved.
    </p>

</div>

</body>
</html>
